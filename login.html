<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - BBAT</title>
    <link rel="icon" href="https://raw.githubusercontent.com/Riwelda/BBAT/refs/heads/main/pngikologo.png" type="image/png">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Quicksand:wght@400&display=swap" rel="stylesheet">
    
    <style>
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
            padding: 20px;
        }
        .auth-card {
            background: white;
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--shadow-soft);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .auth-card h2 {
            color: var(--primary-red);
            margin-bottom: 25px;
        }
        .auth-form input {
            width: 100%;
            padding: 12px 15px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 1rem;
            transition: 0.3s;
        }
        .auth-form input:focus {
            border-color: var(--primary-red);
            outline: none;
            box-shadow: 0 0 5px rgba(169,0,0,0.2);
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            background: var(--primary-red);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .auth-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(169,0,0,0.2);
        }
        .forgot-pw {
            display: block;
            margin-top: 15px;
            color: var(--text-light);
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
        }
        .forgot-pw:hover {
            color: var(--primary-red);
            text-decoration: underline;
        }
        .register-link {
            margin-top: 25px;
            font-size: 0.95rem;
            color: var(--text-dark);
        }
        .register-link a {
            color: var(--primary-red);
            font-weight: bold;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-container">
            <a href="index.html" style="display: flex; align-items: center; gap: 15px;">
                <img src="https://github.com/Riwelda/BBAT/blob/main/unilogo.jpg?raw=true" alt="Kastamonu Üni Logo">
                <div class="site-title" style="text-align:center;">
                    <h1>BİYOLOJİK BİLİMLER<br>ARAŞTIRMA TOPLULUĞU</h1>
                </div>
                <img src="https://raw.githubusercontent.com/Riwelda/BBAT/refs/heads/main/pngikologo.png" alt="BBAT Logo">
            </a>
        </div>
        <nav class="nav-links" id="nav-links">
            <ul>
                <li><a href="index.html">Anasayfa</a></li>
            </ul>
        </nav>
    </header>

    <main class="auth-wrapper">
        <div class="auth-card">
            <h2>Giriş Yap</h2>
            <form id="login-form" class="auth-form">
                <input type="email" id="login-email" placeholder="E-posta Adresiniz" required>
                <input type="password" id="login-password" placeholder="Şifreniz" required>
                <button type="submit" class="auth-btn">Giriş Yap</button>
            </form>
            
            <a id="forgot-password" class="forgot-pw">Şifremi Unuttum</a>
            
            <div class="register-link">
                Hesabınız yok mu? <a href="register.html">Kayıt Ol</a>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAdPt8XuUEzJugYI2R9NpUXUCUQXttHaXI",
            authDomain: "bbat-295c4.firebaseapp.com",
            projectId: "bbat-295c4",
            appId: "1:849546748999:web:476431352773d260fcfd62"
        };

        if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
        const auth = firebase.auth();
        
        // E-postaların Türkçe gitmesi için dil ayarı
        auth.languageCode = 'tr';

        // --- GİRİŞ YAPMA İŞLEMİ ---
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const pass = document.getElementById('login-password').value;

            auth.signInWithEmailAndPassword(email, pass)
                .then((userCredential) => {
                    window.location.href = "index.html"; // Başarılıysa anasayfaya dön
                })
                .catch((error) => {
                    let mesaj = "Giriş başarısız.";
                    if(error.code === 'auth/user-not-found') mesaj = "Bu e-posta ile kayıtlı kullanıcı bulunamadı.";
                    if(error.code === 'auth/wrong-password') mesaj = "Hatalı şifre girdiniz.";
                    if(error.code === 'auth/invalid-credential') mesaj = "E-posta veya şifre hatalı.";
                    alert(mesaj);
                });
        });

        // --- ŞİFRE SIFIRLAMA İŞLEMİ ---
        document.getElementById('forgot-password').addEventListener('click', () => {
            const emailInput = document.getElementById('login-email').value;
            
            // Kullanıcı e-posta kutusuna bir şey yazmış mı kontrol et
            if (!emailInput) {
                alert("Lütfen şifresini sıfırlamak istediğiniz e-posta adresini üstteki kutuya yazın ve tekrar 'Şifremi Unuttum' yazısına tıklayın.");
                document.getElementById('login-email').focus();
                return;
            }

            // Firebase'den sıfırlama maili gönder
            auth.sendPasswordResetEmail(emailInput)
                .then(() => {
                    alert("✅ Şifre sıfırlama bağlantısı e-posta adresinize gönderildi!\n\n(Eğer maili göremiyorsanız 'Gereksiz/Spam' kutunuzu kontrol etmeyi unutmayın.)");
                })
                .catch((error) => {
                    let mesaj = "Bir hata oluştu: " + error.message;
                    if(error.code === 'auth/user-not-found') mesaj = "Bu e-posta adresiyle kayıtlı bir hesap bulunamadı.";
                    if(error.code === 'auth/invalid-email') mesaj = "Lütfen geçerli bir e-posta adresi girin.";
                    alert(mesaj);
                });
        });
    </script>
</body>
</html>
